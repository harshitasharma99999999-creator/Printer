name: Long-Form YouTube Video

on:
  schedule:
    # Runs daily at 8:00 AM IST (2:30 AM UTC)
    - cron: "30 2 * * *"
  workflow_dispatch: {}   # allow manual trigger from GitHub UI

jobs:
  upload:
    runs-on: ubuntu-latest   # GitHub's free cloud runner — always on, no PC needed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth token
        run: echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      - name: Run long-form pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/cron.py longform 944ff01c-c1ee-44f4-a59f-cb3f44b056c0 groq "law of attraction"
