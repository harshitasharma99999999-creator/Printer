name: Affiliate Marketing Shorts

on:
  schedule:
    - cron: "0 5 * * *"   # 10:30 AM IST daily
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick libjpeg-dev zlib1g-dev libpng-dev

      - name: Fix ImageMagick security policy
        run: |
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/<policy domain="coder" rights="none" pattern="PDF"/<policy domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create config.json
        run: |
          cat > config.json << 'EOF'
          {
            "verbose": true,
            "firefox_profile": "",
            "headless": true,
            "ollama_base_url": "http://127.0.0.1:11434",
            "ollama_model": "tinyllama",
            "groq_api_key": "",
            "groq_model": "llama-3.3-70b-versatile",
            "nanobanana2_api_base_url": "https://generativelanguage.googleapis.com/v1beta",
            "nanobanana2_api_key": "${{ secrets.GEMINI_API_KEY }}",
            "nanobanana2_model": "gemini-2.5-flash-image",
            "nanobanana2_aspect_ratio": "9:16",
            "threads": 2,
            "zip_url": "",
            "is_for_kids": false,
            "google_maps_scraper": "",
            "email": {"smtp_server": "smtp.gmail.com", "smtp_port": 587, "username": "", "password": ""},
            "google_maps_scraper_niche": "",
            "scraper_timeout": 300,
            "outreach_message_subject": "",
            "outreach_message_body_file": "outreach_message.html",
            "stt_provider": "local_whisper",
            "whisper_model": "base",
            "whisper_device": "auto",
            "whisper_compute_type": "int8",
            "assembly_ai_api_key": "",
            "tts_voice": "Jasper",
            "font": "bold_font.ttf",
            "imagemagick_path": "/usr/bin/convert",
            "script_sentence_length": 5,
            "affiliate_link": "https://www.amazon.in/b?node=88307513031&linkCode=ll2&tag=harshita000-21",
            "gumroad_access_token": "",
            "ebook_price": 4.99,
            "ebook_author": "Harshita Sharma",
            "kdp_firefox_profile": "",
            "gumroad_firefox_profile": "",
            "kdp_affiliate_link": "",
            "kdp_email": "",
            "kdp_password": ""
          }
          EOF

      - name: Create .mp cache
        run: |
          mkdir -p .mp
          cat > .mp/youtube.json << 'EOF'
          {"accounts": [{"id": "944ff01c-c1ee-44f4-a59f-cb3f44b056c0", "nickname": "universe", "firefox_profile": "", "niche": "manifestation", "language": "english", "videos": []}]}
          EOF
          cat > .mp/afm.json << 'EOF'
          {"products": [{"id": "afm-product-001", "affiliate_link": "https://www.amazon.in/b?node=88307513031&linkCode=ll2&tag=harshita000-21"}]}
          EOF

      - name: Restore YouTube OAuth token
        run: echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      - name: Run AFM pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/cron.py afm afm-product-001 groq
