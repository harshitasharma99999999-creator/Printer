name: Affiliate Marketing Shorts

on:
  schedule:
    - cron: "0 5 * * *"   # 10:30 AM IST
    - cron: "0 17 * * *"  # 10:30 PM IST
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick libjpeg-dev zlib1g-dev libpng-dev

      - name: Fix ImageMagick security policy
        run: |
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/<policy domain="coder" rights="none" pattern="PDF"/<policy domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create config.json
        run: |
          cat > config.json << 'EOF'
          {
            "verbose": true,
            "firefox_profile": "",
            "headless": true,
            "ollama_base_url": "http://127.0.0.1:11434",
            "ollama_model": "tinyllama",
            "groq_api_key": "",
            "groq_model": "llama-3.1-8b-instant",
            "nanobanana2_api_base_url": "https://generativelanguage.googleapis.com/v1beta",
            "nanobanana2_api_key": "${{ secrets.GEMINI_API_KEY }}",
            "nanobanana2_model": "gemini-2.5-flash-image",
            "nanobanana2_aspect_ratio": "9:16",
            "threads": 2,
            "zip_url": "",
            "is_for_kids": false,
            "google_maps_scraper": "",
            "email": {"smtp_server": "smtp.gmail.com", "smtp_port": 587, "username": "", "password": ""},
            "google_maps_scraper_niche": "",
            "scraper_timeout": 300,
            "outreach_message_subject": "",
            "outreach_message_body_file": "outreach_message.html",
            "stt_provider": "local_whisper",
            "whisper_model": "base",
            "whisper_device": "auto",
            "whisper_compute_type": "int8",
            "assembly_ai_api_key": "",
            "tts_voice": "Hugo",
            "font": "bold_font.ttf",
            "imagemagick_path": "/usr/bin/convert",
            "script_sentence_length": 5,
            "affiliate_link": "https://www.amazon.in/b?node=88307513031&linkCode=ll2&tag=harshita000-21",
            "gumroad_access_token": "",
            "ebook_price": 4.99,
            "ebook_author": "Harshita Sharma",
            "kdp_firefox_profile": "",
            "gumroad_firefox_profile": "",
            "kdp_affiliate_link": "",
            "kdp_email": "",
            "kdp_password": ""
          }
          EOF

      - name: Create .mp cache
        run: |
          mkdir -p .mp
          cat > .mp/youtube.json << 'EOF'
          {"accounts": [{"id": "944ff01c-c1ee-44f4-a59f-cb3f44b056c0", "nickname": "universe", "firefox_profile": "", "niche": "Carl Jung psychology empath shadow work spiritual awakening dark wisdom", "language": "english", "videos": []}]}
          EOF
          cat > .mp/afm.json << 'EOF'
          {"products": [
            {"id": "afm-manifestation", "affiliate_link": "https://www.amazon.in/s?k=manifestation+crystals+healing&tag=harshita000-21"},
            {"id": "afm-spiritual",     "affiliate_link": "https://www.amazon.in/s?k=spiritual+healing+products+india&tag=harshita000-21"},
            {"id": "afm-meditation",    "affiliate_link": "https://www.amazon.in/s?k=meditation+yoga+wellness&tag=harshita000-21"}
          ]}
          EOF

      - name: Run AFM pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          IDS=("afm-manifestation" "afm-spiritual" "afm-meditation")
          RANDOM_ID=${IDS[$RANDOM % ${#IDS[@]}]}
          echo "Selected niche: $RANDOM_ID"
          python src/cron.py afm $RANDOM_ID

      - name: Upload to Instagram Reels
        continue-on-error: true
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
          INSTAGRAM_CAPTION: "✨ Elevate your energy ✨\n\nShop healing & manifestation products on Amazon India — link in bio!\n\n#manifestation #healing #crystals #spirituality #lawofattraction #abundance #spiritual #meditation #yoga #wellness #shorts #reels #viral #fyp"
        run: python src/instagram_runner.py
