name: App Release (All-in-One)

on:
  schedule:
    # Build + deploy daily (IST 9:00 AM ≈ 03:30 UTC)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      app_slug:
        description: "Vercel project slug (e.g. task-automator-0330)"
        required: false
        default: "task-automator-0330"
      app_url:
        description: "Live URL (e.g. https://task-automator-0330.vercel.app)"
        required: false
        default: "https://task-automator-0330.vercel.app"
      promote_to_production:
        description: "Promote internal track to production"
        required: false
        default: "false"
      package_name:
        description: "Android package name (e.g. com.moneyprinter.aitaskautomator)"
        required: false
        default: "com.moneyprinter.aitaskautomator"
      rollout_fraction:
        description: "Initial rollout % (0.1 = 10%, 1.0 = 100%)"
        required: false
        default: "0.1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: app-release
  cancel-in-progress: true

jobs:
  build_deploy_test:
    name: Build + Deploy + Internal Track
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Chrome (for automation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable || \
          (wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && \
           sudo apt install -y ./google-chrome-stable_current_amd64.deb) || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Vercel CLI and Bubblewrap
        run: npm install -g vercel@latest @bubblewrap/cli

      - name: Install Android build tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" "platforms;android-34" 2>/dev/null || true

      - name: Create config.json
        run: |
          cat > config.json << 'EOF'
          {
            "verbose": true,
            "firefox_profile": "",
            "headless": true,
            "ollama_base_url": "http://127.0.0.1:11434",
            "ollama_model": "tinyllama",
            "groq_api_key": "",
            "groq_model": "llama-3.3-70b-versatile",
            "nanobanana2_api_base_url": "https://generativelanguage.googleapis.com/v1beta",
            "nanobanana2_api_key": "${{ secrets.GEMINI_API_KEY }}",
            "nanobanana2_model": "gemini-2.5-flash-image",
            "nanobanana2_aspect_ratio": "9:16",
            "threads": 2,
            "zip_url": "",
            "is_for_kids": false,
            "google_maps_scraper": "",
            "email": {"smtp_server": "smtp.gmail.com", "smtp_port": 587, "username": "", "password": ""},
            "google_maps_scraper_niche": "",
            "scraper_timeout": 300,
            "outreach_message_subject": "",
            "outreach_message_body_file": "outreach_message.html",
            "stt_provider": "local_whisper",
            "whisper_model": "base",
            "whisper_device": "auto",
            "whisper_compute_type": "int8",
            "assembly_ai_api_key": "",
            "tts_voice": "Jasper",
            "font": "bold_font.ttf",
            "imagemagick_path": "/usr/bin/convert",
            "script_sentence_length": 5,
            "affiliate_link": "",
            "gumroad_access_token": "",
            "ebook_price": 4.99,
            "ebook_author": "Harshita Sharma",
            "kdp_firefox_profile": "",
            "gumroad_firefox_profile": "",
            "kdp_affiliate_link": "",
            "kdp_email": "",
            "kdp_password": ""
          }
          EOF

      - name: Run Web App Builder
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_PRODUCT_ID: ${{ secrets.DODO_PRODUCT_ID }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          PLAY_STORE_TESTERS: ${{ secrets.PLAY_STORE_TESTERS }}
          TESTERS_COMMUNITY_EMAIL: ${{ secrets.TESTERS_COMMUNITY_EMAIL }}
          TESTERS_COMMUNITY_PASSWORD: ${{ secrets.TESTERS_COMMUNITY_PASSWORD }}
        run: python src/webapp_runner.py

      - name: Free marketing plan (workflow summary)
        run: |
          echo "## Free launch marketing checklist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Post a short demo video to YouTube Shorts + Instagram Reels (3 hooks, 3 days)" >> $GITHUB_STEP_SUMMARY
          echo "- Post to 3 relevant subreddits (no spam): r/SideProject r/Entrepreneur r/Productivity" >> $GITHUB_STEP_SUMMARY
          echo "- Write a Dev.to post: problem → before/after → screenshots → link" >> $GITHUB_STEP_SUMMARY
          echo "- Ask 10 friends/users to review on Play Store after install" >> $GITHUB_STEP_SUMMARY
          echo "- Add your app to your GitHub README + pinned repo" >> $GITHUB_STEP_SUMMARY

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug
          path: |
            .mp/**
          if-no-files-found: ignore

  promote:
    name: Promote to Production
    if: github.event_name == 'workflow_dispatch' && inputs.promote_to_production == 'true'
    runs-on: ubuntu-latest
    needs: build_deploy_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth tweepy

      - name: Promote to production + Tweet
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          ANDROID_PACKAGE_NAME: ${{ inputs.package_name }}
          ROLLOUT_FRACTION: ${{ inputs.rollout_fraction }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python - << 'PY'
          import json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          service_json = os.environ.get("PLAY_STORE_SERVICE_ACCOUNT_JSON", "").strip()
          package_name = os.environ.get("ANDROID_PACKAGE_NAME", "").strip()
          rollout = float(os.environ.get("ROLLOUT_FRACTION", "0.1"))
          if not service_json or not package_name:
            raise SystemExit("Missing PLAY_STORE_SERVICE_ACCOUNT_JSON or ANDROID_PACKAGE_NAME")

          creds = service_account.Credentials.from_service_account_info(
              json.loads(service_json),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          service = build("androidpublisher", "v3", credentials=creds)
          edits = service.edits()

          edit = edits.insert(packageName=package_name, body={}).execute()
          edit_id = edit["id"]

          internal = edits.tracks().get(
              packageName=package_name,
              editId=edit_id,
              track="internal",
          ).execute()

          version_codes = []
          for release in internal.get("releases", []):
              version_codes.extend(release.get("versionCodes", []))
          if not version_codes:
              raise SystemExit("No version codes in internal track. Run build job first.")
          latest_vc = str(max(int(v) for v in version_codes))
          print("Promoting version code:", latest_vc, "rollout:", rollout)

          edits.tracks().update(
              packageName=package_name,
              editId=edit_id,
              track="production",
              body={"releases": [{"versionCodes": [latest_vc], "status": "inProgress", "userFraction": rollout}]},
          ).execute()
          edits.commit(packageName=package_name, editId=edit_id).execute()
          print("Done. Production rollout started.")

          # Optional tweet
          try:
              import tweepy
              client = tweepy.Client(
                  consumer_key=os.environ.get("TWITTER_API_KEY"),
                  consumer_secret=os.environ.get("TWITTER_API_SECRET"),
                  access_token=os.environ.get("TWITTER_ACCESS_TOKEN"),
                  access_token_secret=os.environ.get("TWITTER_ACCESS_TOKEN_SECRET"),
              )
              tweet = (
                  "🚀 Update: our app is now rolling out on Google Play.\n\n"
                  f"https://play.google.com/store/apps/details?id={package_name}\n\n"
                  "#Android #GooglePlay #IndieHacker"
              )
              client.create_tweet(text=tweet)
              print("Tweet posted.")
          except Exception as e:
              print("Tweet failed (non-critical):", e)
          PY

