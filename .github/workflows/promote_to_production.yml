name: Promote App to Production

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Android package name (e.g. com.moneyprinter.aitaskautomator)"
        required: false
        default: "com.moneyprinter.aitaskautomator"
      rollout_fraction:
        description: "Initial rollout % (0.1 = 10%, 1.0 = 100%)"
        required: false
        default: "0.1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth tweepy

      - name: Promote to production
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          ANDROID_PACKAGE_NAME: ${{ inputs.package_name }}
          ROLLOUT_FRACTION: ${{ inputs.rollout_fraction }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python - << 'EOF'
          import json, os, traceback

          service_json = os.environ.get("PLAY_STORE_SERVICE_ACCOUNT_JSON", "").strip()
          package_name = os.environ.get("ANDROID_PACKAGE_NAME", "com.moneyprinter.aitaskautomator")
          rollout = float(os.environ.get("ROLLOUT_FRACTION", "0.1"))

          print(f"Promoting {package_name} to production at {int(rollout*100)}% rollout...")

          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds = service_account.Credentials.from_service_account_info(
              json.loads(service_json),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          service = build("androidpublisher", "v3", credentials=creds)
          edits = service.edits()

          # Get latest version code from internal track
          edit = edits.insert(packageName=package_name, body={}).execute()
          edit_id = edit["id"]

          internal = edits.tracks().get(
              packageName=package_name,
              editId=edit_id,
              track="internal",
          ).execute()

          version_codes = []
          for release in internal.get("releases", []):
              version_codes.extend(release.get("versionCodes", []))

          if not version_codes:
              print("No version codes found in internal track. Run webapp_builder first.")
              exit(1)

          latest_vc = str(max(int(v) for v in version_codes))
          print(f"Promoting version code: {latest_vc}")

          # Promote to production
          edits.tracks().update(
              packageName=package_name,
              editId=edit_id,
              track="production",
              body={
                  "releases": [{
                      "versionCodes": [latest_vc],
                      "status": "inProgress",
                      "userFraction": rollout,
                  }]
              },
          ).execute()

          edits.commit(packageName=package_name, editId=edit_id).execute()
          print(f"✅ Promoted to production at {int(rollout*100)}% rollout!")
          print(f"🔗 https://play.google.com/store/apps/details?id={package_name}")

          # Tweet the launch
          try:
              import tweepy
              client = tweepy.Client(
                  consumer_key=os.environ.get("TWITTER_API_KEY"),
                  consumer_secret=os.environ.get("TWITTER_API_SECRET"),
                  access_token=os.environ.get("TWITTER_ACCESS_TOKEN"),
                  access_token_secret=os.environ.get("TWITTER_ACCESS_TOKEN_SECRET"),
              )
              tweet = (
                  f"🚀 Our app is now LIVE on Google Play Store!\n\n"
                  f"Download it free:\n"
                  f"https://play.google.com/store/apps/details?id={package_name}\n\n"
                  f"#Android #GooglePlay #App #Launch"
              )
              client.create_tweet(text=tweet)
              print("✅ Launch tweet posted!")
          except Exception as e:
              print(f"Tweet failed (non-critical): {e}")

          EOF
