name: Repair & Market App

on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: "Vercel project slug (e.g. task-automator-0330)"
        required: true
        default: "task-automator-0330"
      app_url:
        description: "Live URL (e.g. https://task-automator-0330.vercel.app)"
        required: true
        default: "https://task-automator-0330.vercel.app"
      app_name:
        description: "App name"
        required: false
        default: "Task Automator"
      app_tagline:
        description: "App tagline"
        required: false
        default: "Automate Repetitive Tasks Instantly"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create config.json
        run: |
          cat > config.json << 'EOF'
          {
            "verbose": true,
            "firefox_profile": "",
            "headless": true,
            "ollama_base_url": "http://127.0.0.1:11434",
            "ollama_model": "tinyllama",
            "groq_api_key": "",
            "groq_model": "llama-3.1-8b-instant",
            "nanobanana2_api_base_url": "https://generativelanguage.googleapis.com/v1beta",
            "nanobanana2_api_key": "${{ secrets.GEMINI_API_KEY }}",
            "nanobanana2_model": "gemini-2.5-flash-image",
            "nanobanana2_aspect_ratio": "9:16",
            "threads": 2, "zip_url": "", "is_for_kids": false,
            "google_maps_scraper": "", "google_maps_scraper_niche": "",
            "email": {"smtp_server":"smtp.gmail.com","smtp_port":587,"username":"","password":""},
            "scraper_timeout": 300, "outreach_message_subject": "",
            "outreach_message_body_file": "outreach_message.html",
            "stt_provider": "local_whisper", "whisper_model": "base",
            "whisper_device": "auto", "whisper_compute_type": "int8",
            "assembly_ai_api_key": "", "tts_voice": "Hugo",
            "font": "bold_font.ttf", "imagemagick_path": "/usr/bin/convert",
            "script_sentence_length": 5, "affiliate_link": "",
            "gumroad_access_token": "", "ebook_price": 4.99,
            "ebook_author": "Harshita Sharma", "kdp_firefox_profile": "",
            "gumroad_firefox_profile": "", "kdp_affiliate_link": "",
            "kdp_email": "", "kdp_password": ""
          }
          EOF

      - name: Run repair + market
        env:
          REPAIR_APP_SLUG: ${{ github.event.inputs.app_slug }}
          REPAIR_APP_URL: ${{ github.event.inputs.app_url }}
          REPAIR_APP_NAME: ${{ github.event.inputs.app_name }}
          REPAIR_APP_TAGLINE: ${{ github.event.inputs.app_tagline }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_PRODUCT_ID: ${{ secrets.DODO_PRODUCT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python src/repair_app.py
