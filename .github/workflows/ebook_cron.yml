name: EBook Publisher

on:
  schedule:
    - cron: "0 1 * * *"   # Every day 6:30 AM IST
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjpeg-dev zlib1g-dev libpng-dev
          sudo apt-get install -y google-chrome-stable || \
          (wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && \
           sudo apt install -y ./google-chrome-stable_current_amd64.deb) || true
          google-chrome --version || true
          chromedriver --version || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create config.json
        run: |
          cat > config.json << 'EOF'
          {
            "verbose": true,
            "firefox_profile": "",
            "headless": true,
            "ollama_base_url": "http://127.0.0.1:11434",
            "ollama_model": "tinyllama",
            "groq_api_key": "",
            "groq_model": "llama-3.1-8b-instant",
            "nanobanana2_api_base_url": "https://generativelanguage.googleapis.com/v1beta",
            "nanobanana2_api_key": "",
            "nanobanana2_model": "gemini-2.5-flash-image",
            "nanobanana2_aspect_ratio": "9:16",
            "threads": 2,
            "zip_url": "",
            "is_for_kids": false,
            "google_maps_scraper": "",
            "email": {"smtp_server": "smtp.gmail.com", "smtp_port": 587, "username": "", "password": ""},
            "google_maps_scraper_niche": "",
            "scraper_timeout": 300,
            "outreach_message_subject": "",
            "outreach_message_body_file": "outreach_message.html",
            "stt_provider": "local_whisper",
            "whisper_model": "base",
            "whisper_device": "auto",
            "whisper_compute_type": "int8",
            "assembly_ai_api_key": "",
            "tts_voice": "Hugo",
            "font": "bold_font.ttf",
            "imagemagick_path": "/usr/bin/convert",
            "script_sentence_length": 5,
            "affiliate_link": "https://www.amazon.in/b?node=88307513031&linkCode=ll2&tag=harshita000-21",
            "gumroad_access_token": "",
            "gumroad_firefox_profile": "",
            "ebook_price": 4.99,
            "ebook_author": "Harshita Sharma",
            "kdp_firefox_profile": "",
            "kdp_affiliate_link": "https://www.amazon.in/b?node=88307513031&linkCode=ll2&tag=harshita000-21",
            "kdp_email": "",
            "kdp_password": "",
            "twitter_language": "English"
          }
          EOF

      - name: Create .mp cache directory
        run: mkdir -p .mp

      - name: Run EBook pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GUMROAD_SESSION_JSON: ${{ secrets.GUMROAD_SESSION_JSON }}
          GUMROAD_EMAIL: ${{ secrets.GUMROAD_EMAIL }}
          GUMROAD_PASSWORD: ${{ secrets.GUMROAD_PASSWORD }}
          KDP_EMAIL: ${{ secrets.KDP_EMAIL }}
          KDP_PASSWORD: ${{ secrets.KDP_PASSWORD }}
          KDP_TOTP_SECRET: ${{ secrets.KDP_TOTP_SECRET }}
          KDP_SESSION_JSON: ${{ secrets.KDP_SESSION_JSON }}
          KDP_PUBLISH_PAPERBACK: "true"
          KDP_PUBLISH_HARDCOVER: "true"
          REQUIRE_KDP_PUBLISH: "true"
          KDP_PRINT_TRIM_SIZE: "6x9"
          KDP_PRINT_PAPER: "cream"
          NO_PROXY: "*"
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
        run: python src/cron.py ebook dummy-id groq

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ebook-debug
          path: |
            .mp/*.png
            .mp/*.pdf
            .mp/*.epub
          if-no-files-found: ignore
