name: Spiritual Image Posts

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"   # Every 6 hours (offset from Shorts)
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick libjpeg-dev zlib1g-dev libpng-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create config.json
        run: |
          cat > config.json << 'EOF'
          {
            "verbose": true,
            "firefox_profile": "",
            "headless": true,
            "ollama_base_url": "http://127.0.0.1:11434",
            "ollama_model": "tinyllama",
            "groq_api_key": "",
            "groq_model": "llama-3.1-8b-instant",
            "nanobanana2_api_base_url": "https://generativelanguage.googleapis.com/v1beta",
            "nanobanana2_api_key": "${{ secrets.GEMINI_API_KEY }}",
            "nanobanana2_model": "gemini-2.5-flash-image",
            "nanobanana2_aspect_ratio": "9:16",
            "threads": 2, "zip_url": "", "is_for_kids": false,
            "google_maps_scraper": "", "google_maps_scraper_niche": "",
            "email": {"smtp_server":"smtp.gmail.com","smtp_port":587,"username":"","password":""},
            "scraper_timeout": 300, "outreach_message_subject": "",
            "outreach_message_body_file": "outreach_message.html",
            "stt_provider": "local_whisper", "whisper_model": "base",
            "whisper_device": "auto", "whisper_compute_type": "int8",
            "assembly_ai_api_key": "", "tts_voice": "Hugo",
            "font": "bold_font.ttf", "imagemagick_path": "/usr/bin/convert",
            "script_sentence_length": 5, "affiliate_link": "",
            "gumroad_access_token": "", "ebook_price": 4.99,
            "ebook_author": "Harshita Sharma", "kdp_firefox_profile": "",
            "gumroad_firefox_profile": "", "kdp_affiliate_link": "",
            "kdp_email": "", "kdp_password": ""
          }
          EOF

      - name: Create .mp cache and YouTube account seed
        run: |
          mkdir -p .mp
          cat > .mp/youtube.json << 'EOF'
          {"accounts": [{"id": "944ff01c-c1ee-44f4-a59f-cb3f44b056c0", "nickname": "universe", "firefox_profile": "", "niche": "reality shifting raise your vibration aura reading law of attraction manifesting 5D consciousness spiritual awakening", "language": "english", "videos": []}]}
          EOF

      - name: Run image post pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python src/image_post_runner.py
