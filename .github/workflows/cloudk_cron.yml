name: Grand Forno Cloud Kitchen

on:
  schedule:
    # 3× daily at meal times (IST = UTC+5:30)
    # 8:00 AM IST  = 02:30 UTC  → breakfast content
    # 1:00 PM IST  = 07:30 UTC  → lunch content
    # 7:00 PM IST  = 13:30 UTC  → dinner content
    - cron: "30 2 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick libjpeg-dev zlib1g-dev libpng-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create config.json
        run: |
          cat > config.json << 'EOF'
          {
            "verbose": true,
            "firefox_profile": "",
            "headless": true,
            "ollama_base_url": "http://127.0.0.1:11434",
            "ollama_model": "tinyllama",
            "groq_api_key": "",
            "groq_model": "llama-3.1-8b-instant",
            "nanobanana2_api_base_url": "https://generativelanguage.googleapis.com/v1beta",
            "nanobanana2_api_key": "${{ secrets.GEMINI_API_KEY }}",
            "nanobanana2_model": "gemini-2.5-flash-image",
            "nanobanana2_aspect_ratio": "1:1",
            "threads": 2, "zip_url": "", "is_for_kids": false,
            "google_maps_scraper": "", "google_maps_scraper_niche": "",
            "email": {"smtp_server":"smtp.gmail.com","smtp_port":587,"username":"","password":""},
            "scraper_timeout": 300, "outreach_message_subject": "",
            "outreach_message_body_file": "outreach_message.html",
            "stt_provider": "local_whisper", "whisper_model": "base",
            "whisper_device": "auto", "whisper_compute_type": "int8",
            "assembly_ai_api_key": "", "tts_voice": "Hugo",
            "font": "bold_font.ttf", "imagemagick_path": "/usr/bin/convert",
            "script_sentence_length": 5, "affiliate_link": "",
            "gumroad_access_token": "", "ebook_price": 4.99,
            "ebook_author": "Harshita Sharma", "kdp_firefox_profile": "",
            "gumroad_firefox_profile": "", "kdp_affiliate_link": "",
            "kdp_email": "", "kdp_password": ""
          }
          EOF

      - name: Create .mp directory
        run: mkdir -p .mp

      - name: Run Cloud Kitchen post pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDK_INSTAGRAM_USERNAME: ${{ secrets.CLOUDK_INSTAGRAM_USERNAME }}
          CLOUDK_INSTAGRAM_PASSWORD: ${{ secrets.CLOUDK_INSTAGRAM_PASSWORD }}
          CLOUDK_INSTAGRAM_SESSION_JSON: ${{ secrets.CLOUDK_INSTAGRAM_SESSION_JSON }}
        run: python src/cloudk_runner.py
