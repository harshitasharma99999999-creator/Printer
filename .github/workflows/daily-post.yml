name: Grand Forno Daily Reel and Short

on:
  schedule:
    # 19:00 Asia/Kolkata (IST is UTC+05:30 and has no daylight saving time).
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render and package content without publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: grand-forno-daily-post
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.4-mini
      VOICE_API_KEY: ${{ secrets.VOICE_API_KEY }}
      VOICE_ID: ${{ vars.VOICE_ID }}
      AVATAR_API_KEY: ${{ secrets.AVATAR_API_KEY }}
      AVATAR_ID: ${{ vars.AVATAR_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: public
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_GRAPH_VERSION: v23.0
      INSTAGRAM_MODE: auto
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      ALLOW_GENERATION_FALLBACK: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-grand-forno.txt

      - name: Install FFmpeg, fonts, and local dry-run voice
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-grand-forno.txt

      - name: Validate production credentials
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          missing=0
          for name in OPENAI_API_KEY VOICE_API_KEY AVATAR_API_KEY AVATAR_ID YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for a live run"
              missing=1
            fi
          done
          exit "$missing"

      - name: Generate and publish
        run: python scripts/main.py

      - name: Commit history and structured logs
        if: ${{ always() }}
        shell: bash
        run: |
          git config user.name "grand-forno-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post_history.json logs/
          if ! git diff --cached --quiet; then
            git commit -m "Update Grand Forno post history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save rendered media and manual Instagram package
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: grand-forno-${{ github.run_id }}
          path: |
            output/
            logs/
          if-no-files-found: warn
          retention-days: 30
