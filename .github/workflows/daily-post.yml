name: Legacy Daily Reel and Short Disabled

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Disabled legacy workflow; use Fresh HVN Daily Beverage Posts instead
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fresh-hvn-legacy-daily-post-disabled
  cancel-in-progress: false

jobs:
  create-and-publish:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.4-mini
      AVATAR_MODE: visual
      BACKGROUND_MUSIC_PATH: assets/music/fresh-upbeat-loop.wav
      BACKGROUND_MUSIC_VOLUME: "0.85"
      MUSIC_ONLY_DURATION_SECONDS: "28"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_TARGET_HANDLE: "@fresh_hvn"
      YOUTUBE_PRIVACY_STATUS: public
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_TARGET_HANDLE: fresh_hvn
      INSTAGRAM_GRAPH_VERSION: v23.0
      # Preferred official paths: meta_graph or upload_post. Last-resort: instagrapi.
      INSTAGRAM_PROVIDER: upload_post
      INSTAGRAM_USERNAME: ${{ secrets.GRAND_FORNO_INSTAGRAM_USERNAME }}
      INSTAGRAM_PASSWORD: ${{ secrets.GRAND_FORNO_INSTAGRAM_PASSWORD }}
      INSTAGRAM_SESSION_JSON: ${{ secrets.GRAND_FORNO_INSTAGRAM_SESSION_JSON }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
      UPLOAD_POST_ASYNC: "true"
      INSTAGRAM_MODE: auto
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      ALLOW_GENERATION_FALLBACK: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-grand-forno.txt

      - name: Install FFmpeg, fonts, and local dry-run voice
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-grand-forno.txt

      - name: Validate production credentials
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          missing=0
          for name in OPENAI_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN BACKGROUND_MUSIC_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for a live run"
              missing=1
            fi
          done
          if [ "${YOUTUBE_TARGET_HANDLE}" != "@fresh_hvn" ]; then
            echo "::error::YOUTUBE_TARGET_HANDLE must be @fresh_hvn"
            missing=1
          fi
          if [ "${INSTAGRAM_TARGET_HANDLE}" != "fresh_hvn" ]; then
            echo "::error::INSTAGRAM_TARGET_HANDLE must be fresh_hvn"
            missing=1
          fi
          if [ -n "${INSTAGRAM_USERNAME}" ] && [ "${INSTAGRAM_USERNAME#@}" != "fresh_hvn" ]; then
            echo "::error::INSTAGRAM_USERNAME must be fresh_hvn"
            missing=1
          fi
          if [ -n "${UPLOAD_POST_USER}" ] && [ "${UPLOAD_POST_USER#@}" != "fresh_hvn" ]; then
            echo "::error::UPLOAD_POST_USER must be fresh_hvn"
            missing=1
          fi
          if [ ! -s "${BACKGROUND_MUSIC_PATH}" ]; then
            echo "::error::BACKGROUND_MUSIC_PATH must point to an approved licensed English trending-style song listed in assets/music/trending_songs.json"
            missing=1
          fi
          if [ "${INSTAGRAM_PROVIDER}" = "instagrapi" ]; then
            if [ -z "${INSTAGRAM_SESSION_JSON}" ] && { [ -z "${INSTAGRAM_USERNAME}" ] || [ -z "${INSTAGRAM_PASSWORD}" ]; }; then
              echo "::error::For Instagram private API posting, set INSTAGRAM_SESSION_JSON or both INSTAGRAM_USERNAME and INSTAGRAM_PASSWORD"
              missing=1
            fi
          fi
          if [ "${INSTAGRAM_PROVIDER}" = "upload_post" ]; then
            if [ -z "${UPLOAD_POST_API_KEY}" ] || [ -z "${UPLOAD_POST_USER}" ]; then
              echo "::error::For Upload-Post Instagram publishing, set UPLOAD_POST_API_KEY secret and UPLOAD_POST_USER variable"
              missing=1
            fi
          fi
          exit "$missing"

      - name: Generate and publish
        run: python scripts/main.py

      - name: Commit history and structured logs
        if: ${{ always() }}
        shell: bash
        run: |
          git config user.name "fresh-hvn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post_history.json logs/
          if ! git diff --cached --quiet; then
            git commit -m "Update Fresh HVN post history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save rendered media and manual Instagram package
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-hvn-legacy-${{ github.run_id }}
          path: |
            output/
            logs/
          if-no-files-found: warn
          retention-days: 30
