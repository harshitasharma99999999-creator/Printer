name: SEO Blog Site - Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "blog_site/**"
      - "content/ai-crypto/**"
      - ".github/workflows/seo_blog_vercel.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: seo-blog-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install blog dependencies
        working-directory: blog_site
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: blog_site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.BLOG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.BLOG_VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build SEO blog
        working-directory: blog_site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.BLOG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.BLOG_VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.BLOG_SITE_URL }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}
          NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy SEO blog
        working-directory: blog_site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.BLOG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.BLOG_VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
